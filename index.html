<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINVORA — AI Financial Intelligence & Decision Support</title>
  <meta name="description"
    content="Finance Copilot + Predictive Intelligence = FINVORA. Built for Modern Enterprise Finance Teams." />
  <!-- Pre-paint Theme Script to eliminate flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('FINVORA_THEME_MODE');
        var isDark = false;
        if (saved === 'dark') {
          isDark = true;
        } else if (saved === 'light') {
          isDark = false;
        } else {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) { }
    })();
  </script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet">
</head>

<body
  class="bg-[var(--app-bg)] text-[var(--text-primary)] antialiased selection:bg-[#F59E0B]/20 selection:text-[#F59E0B] min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
